name: finanzas_pro
description: "Sistema de gestión financiera y control de caja multimoneda en Flutter."
publish_to: 'none'

version: 1.2.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Gestor de estado global
  provider: ^6.1.1

  # Cliente de conexión HTTP a Apps Script / Drive
  http: ^1.2.0

  # Persistencia de datos locales
  shared_preferences: ^2.2.2

  # Formato de números y fechas (Moneda/Fechas)
  intl: ^0.19.0

  # Captura y compartición de reportes
  screenshot: ^3.0.0
  share_plus: ^10.0.0

  # Iconos
  cupertino_icons: ^1.0.6
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true